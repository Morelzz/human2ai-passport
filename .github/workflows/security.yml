name: security-audit
on:
  pull_request:
  push:
    branches: [master]
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit (blocca su critical)
        run: npm audit --audit-level=critical
      - name: Report completo (non bloccante, mostra anche moderate/high)
        if: always()
        run: npm audit || true

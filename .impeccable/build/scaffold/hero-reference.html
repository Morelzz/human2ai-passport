<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-3.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f4ea}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-logo region chrome" data-region="logo"><!-- black rounded square mark and wordmark SEMBLIC --></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- nav links Registro Crea Proteggi Prezzi Academy --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-accedi region control" data-region="nav-accedi"><!-- outlined pill Accedi: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-accedi); a control need not have button chrome --></div>
  <div class="r-nav-registrati region control" data-region="nav-registrati"><!-- black pill Registrati: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-registrati); a control need not have button chrome --></div>
  <div class="r-nav-rule region chrome" data-region="nav-rule"><!-- hairline under the navigation --></div>
  <div class="r-headline region text" data-region="headline"><!-- headline Ogni volto qui ha detto si --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- grey line Una foto, due persone contente --><p style="font-size:var(--r-subline-font);line-height:1.05;margin:0">subline</p></div>
  <div class="r-panel-crea region chrome" data-region="panel-crea"><!-- white rounded panel for the creator side --></div>
  <figure class="r-foto-scatto region plate" data-region="foto-scatto"><img src="../../../assets/plates/foto-scatto.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-pill-certificato region control" data-region="pill-certificato"><!-- white label Certificato SEMBLIC over the top left corner of the image: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop pill-certificato); a control need not have button chrome --></div>
  <div class="r-caption-scatto region text" data-region="caption-scatto"><!-- grey caption Scatto verticale, alta qualita --><p style="font-size:var(--r-caption-scatto-font);line-height:1.05;margin:0">caption-scatto</p></div>
  <div class="r-prezzo region text" data-region="prezzo"><!-- large price 0,50 euro --><p style="font-size:var(--r-prezzo-font);line-height:1.05;margin:0">prezzo</p></div>
  <div class="r-btn-crea region control" data-region="btn-crea"><!-- amber full-width pill Crea con volti veri: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-crea); a control need not have button chrome --></div>
  <div class="r-panel-volto region chrome" data-region="panel-volto"><!-- light warm grey rounded panel for the person side --></div>
  <figure class="r-ritratto region plate" data-region="ritratto"><img src="../../../assets/plates/ritratto.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nome region text" data-region="nome"><!-- first name Anna --><p style="font-size:var(--r-nome-font);line-height:1.05;margin:0">nome</p></div>
  <div class="r-pill-consenso region control" data-region="pill-consenso"><!-- green label consenso attivo with dot: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop pill-consenso); a control need not have button chrome --></div>
  <div class="r-riga-ricevuto region text" data-region="riga-ricevuto"><!-- icon and line Ha ricevuto 0,11 euro per questo scatto --><p style="font-size:var(--r-riga-ricevuto-font);line-height:1.05;margin:0">riga-ricevuto</p></div>
  <div class="r-riga-revoca region text" data-region="riga-revoca"><!-- shield icon and line Revoca quando vuole, vale subito --><p style="font-size:var(--r-riga-revoca-font);line-height:1.05;margin:0">riga-revoca</p></div>
  <div class="r-riga-regole region text" data-region="riga-regole"><!-- person icon and line Decide lei a cosa dice no, con parole sue --><p style="font-size:var(--r-riga-regole-font);line-height:1.05;margin:0">riga-regole</p></div>
  <div class="r-btn-volto region control" data-region="btn-volto"><!-- black full-width pill Metti il tuo volto: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-volto); a control need not have button chrome --></div>
</main>
</body>
</html>
